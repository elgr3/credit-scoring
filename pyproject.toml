[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-scoring"
version = "1.0.0"
description = "Credit default scoring on Give Me Some Credit (XGBoost + SHAP)"
requires-python = ">=3.11"
dependencies = [
  "pandas==2.2.3",
  "numpy==1.26.4",
  "scikit-learn==1.5.2",
  "xgboost==2.1.3",
  "shap==0.46.0",
  "matplotlib==3.9.2",
  "pyarrow==18.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
